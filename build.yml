name: Build TREZORA Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            artifact-name: TREZORA-windows
            artifact-path: |
              dist/*.exe
          - os: macos-latest
            script: dist:mac
            artifact-name: TREZORA-mac
            artifact-path: |
              dist/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            artifact-name: TREZORA-linux
            artifact-path: |
              dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Compiler l'application (${{ matrix.os }})
        run: npm run ${{ matrix.script }}

      - name: Publier le résultat en artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: warn
